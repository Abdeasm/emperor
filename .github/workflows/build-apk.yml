name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp -f *.png *.js *.json *.css www/ 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Capacitor and Build APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6
          npx cap init "Emperor" "com.emperor.game" --web-dir="www"
          python3 - << 'PY'
          import json
          c = json.load(open('capacitor.config.json'))
          c['server'] = {'url': 'https://abdeasm.github.io/emperor/'}
          json.dump(c, open('capacitor.config.json', 'w'))
          PY
          npx cap add android
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          f = '<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="emperorgame" android:host="auth"/></intent-filter>'
          assert '</activity>' in s
          open(p, 'w').write(s.replace('</activity>', f + '</activity>', 1))
          PY
          npx cap sync android
          cat << 'EOF2' >> android/app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF2
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emperor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
